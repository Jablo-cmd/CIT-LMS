# Render Blueprint — CIT-LMS staging/production
# Node engines: >=22.12.0 (see package.json)
# After first deploy: set WEB_ORIGIN and NEXT_PUBLIC_API_URL to the live service URLs,
# seed reference data, then run owner:bootstrap from the API shell.

databases:
  - name: cit-lms-db
    plan: basic-256mb
    databaseName: cit_lms
    user: cit_lms

services:
  - type: web
    name: cit-lms-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace @cit-lms/api
    startCommand: npm run db:deploy --workspace @cit-lms/api && npm run start --workspace @cit-lms/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: DATABASE_URL
        fromDatabase:
          name: cit-lms-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_ROOT
        value: /var/data/cit-lms-storage
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
    disk:
      name: cit-lms-docs
      mountPath: /var/data/cit-lms-storage
      sizeGB: 5

  - type: web
    name: cit-lms-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace @cit-lms/web
    startCommand: npm run start --workspace @cit-lms/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
