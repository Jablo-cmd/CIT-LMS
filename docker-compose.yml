services:
  postgres:
    image: postgres:16-alpine
    container_name: cit-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cit_lms
      POSTGRES_USER: cit_lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    ports:
      - "5433:5432"
    volumes:
      - cit_lms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cit_lms -d cit_lms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cit_lms_postgres:
